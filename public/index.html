<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salas de Voz</title>
<style>
:root{--bg:#111318;--card:#1b1e26;--tx:#e8eaf0;--ac:#5b8cff;--bad:#ff5b5b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#lobby{max-width:380px;margin:10vh auto;padding:24px;background:var(--card);border-radius:14px;display:flex;flex-direction:column;gap:12px}
h1{margin:0 0 4px;font-size:22px}
input{padding:12px;border-radius:8px;border:1px solid #333a48;background:#0e1015;color:var(--tx);font-size:15px}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
button.sec{background:#2a2f3b}button.off{background:var(--bad)}
.row{display:flex;gap:8px}.row button{flex:1}
#err{color:var(--bad);min-height:18px;font-size:14px}
#room{display:none;height:100vh;flex-direction:column}
#bar{padding:10px 16px;background:var(--card);display:flex;justify-content:space-between;align-items:center}
#grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;padding:10px;overflow:auto;align-content:start}
.tile{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.tile video{width:100%;height:100%;object-fit:contain}
.tile span{position:absolute;left:8px;bottom:8px;background:#000a;padding:3px 8px;border-radius:6px;font-size:13px}
.tile{cursor:pointer}
#grid.focus{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile.big{grid-column:1/-1;order:-1;aspect-ratio:auto;height:62vh}
.tile b{position:absolute;right:8px;top:8px;background:#000a;padding:3px 8px;border-radius:6px;font-size:15px;opacity:.8}
.tile b:hover{opacity:1;background:var(--ac)}
#ctl{padding:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:var(--card)}
</style></head><body>
<div id="lobby">
  <h1>🎙️ Salas de Voz</h1>
  <input id="name" placeholder="Seu nome" maxlength="24">
  <input id="rname" placeholder="Nome da sala" maxlength="40">
  <input id="pw" type="password" placeholder="Senha (opcional)" maxlength="100">
  <div class="row"><button id="create">Criar sala</button><button id="join" class="sec">Entrar</button></div>
  <div id="err"></div>
</div>
<div id="room">
  <div id="bar"><b id="title"></b><span id="count"></span></div>
  <div id="grid"></div>
  <div id="ctl">
    <button id="mic">🎤 Mutar</button>
    <button id="cam" class="sec">📷 Câmera</button>
    <button id="scr" class="sec">🖥️ Compartilhar tela</button>
    <button id="out" class="off">Sair</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body></html>
